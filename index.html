<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palestra</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141B18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palestra">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --carta:#E9ECE6; --superficie:#FFFFFF; --inchiostro:#141B18; --tenue:#5B6661;
  --linea:#CDD3CB; --blu:#1F4A6B; --senape:#C08411; --rosso:#A3341F; --verde:#2E6B4F;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --testo:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--testo);background:var(--carta);color:var(--inchiostro);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
#app{max-width:560px;margin:0 auto;padding:0 0 150px}

.testata{padding:calc(20px + env(safe-area-inset-top)) 18px 12px}
.riga{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.occhiello{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue);margin-bottom:4px}
.titolone{font-size:32px;font-weight:800;line-height:1;margin:0;letter-spacing:-.03em}
.sotto{font-size:13px;color:var(--tenue);margin-top:5px}
.spia{font-family:var(--mono);font-size:10.5px;color:var(--tenue);padding-top:6px}

.avviso{margin:0 18px 12px;padding:11px 13px;background:var(--inchiostro);color:#EFF2EE;font-size:13px;border-radius:3px;display:flex;justify-content:space-between;gap:10px}
.avviso-x{font-family:var(--mono);font-size:10.5px;opacity:.65;white-space:nowrap}

.corpo{padding:0 18px;display:flex;flex-direction:column;gap:12px}
.pannello{background:var(--superficie);border:1px solid var(--linea);border-radius:3px;padding:15px}
.etichetta{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.nota{font-size:12.5px;color:var(--tenue);line-height:1.55;margin-top:9px}

/* scelta del giorno */
.giorni{display:flex;gap:8px}
.gio{flex:1;padding:14px 8px;border:1px solid var(--linea);border-radius:3px;background:var(--superficie);text-align:center}
.gio.on{background:var(--inchiostro);color:#F2F5F1;border-color:var(--inchiostro)}
.gio b{display:block;font-size:15px;font-weight:700}
.gio span{display:block;font-size:11px;opacity:.7;margin-top:3px}
.consiglio{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--senape);margin-top:4px}

/* avanzamento */
.avanz{display:flex;justify-content:space-between;align-items:baseline}
.avanz-c{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.avanz-c span{font-size:13px;font-weight:400;color:var(--tenue)}
.nastro{height:8px;background:#EDEFEA;border:1px solid var(--linea);border-radius:1px;margin-top:11px;overflow:hidden}
.nastro i{display:block;height:100%;background:var(--verde);transition:width .35s cubic-bezier(.2,.7,.3,1)}

/* esercizio */
.es{background:var(--superficie);border:1px solid var(--linea);border-radius:3px;padding:14px;transition:opacity .25s}
.es.fatto{opacity:.5}
.es-testa{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.es-nome{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0}
.es-pre{font-family:var(--mono);font-size:11px;color:var(--tenue);white-space:nowrap}
.es-nota{font-size:12px;color:var(--senape);margin-top:6px;line-height:1.45}

.serie{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.set{
  min-width:52px;height:50px;border:1.5px solid var(--linea);border-radius:3px;
  background:var(--superficie);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;flex:1;transition:background .18s,border-color .18s;
}
.set b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.set i{font-family:var(--mono);font-size:8.5px;font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.set.on{background:var(--verde);border-color:var(--verde);color:#fff}
.set.on i{color:rgba(255,255,255,.75)}
.set:active{transform:scale(.96)}

.peso{display:flex;align-items:center;gap:8px;margin-top:11px}
.peso input{width:82px;padding:10px;text-align:center;font-size:16px;font-weight:600;border:1px solid var(--linea);border-radius:3px;background:var(--superficie);color:var(--inchiostro)}
.peso input:focus{outline:2px solid var(--blu);outline-offset:1px}
.peso .u{font-size:13px;color:var(--tenue)}
.peso .prec{font-family:var(--mono);font-size:10.5px;color:var(--tenue);margin-left:auto;text-align:right}

.bcardio{width:100%;margin-top:12px;padding:13px;border:1px solid var(--inchiostro);border-radius:3px;font-size:14px;font-weight:600}
.bcardio.on{background:var(--verde);border-color:var(--verde);color:#fff}

.b1{width:100%;background:var(--inchiostro);color:#F2F5F1;padding:15px;border-radius:3px;font-size:15px;font-weight:600;margin-top:6px}
.b2{width:100%;background:transparent;padding:13px;border:1px solid var(--inchiostro);border-radius:3px;font-size:14px;font-weight:500;margin-top:9px}
.b1:active,.b2:active{transform:scale(.985)}

/* TIMER — l'elemento che comanda la seduta */
.timer{
  position:fixed;left:0;right:0;bottom:54px;max-width:560px;margin:0 auto;
  background:var(--inchiostro);color:#F2F5F1;padding:14px 18px calc(14px);
  transform:translateY(140%);transition:transform .28s cubic-bezier(.2,.8,.3,1);z-index:20;
}
.timer.su{transform:translateY(0)}
.timer.finito{background:var(--verde)}
.t-riga{display:flex;align-items:center;justify-content:space-between;gap:12px}
.t-et{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.t-num{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.t-bot{display:flex;gap:7px}
.t-b{padding:11px 13px;border:1px solid rgba(255,255,255,.35);border-radius:3px;font-size:13px;font-weight:600;color:#F2F5F1}
.t-linea{height:3px;background:rgba(255,255,255,.2);margin-top:11px;border-radius:2px;overflow:hidden}
.t-linea i{display:block;height:100%;background:#F2F5F1;width:100%}

/* storico */
.gruppo{margin-top:6px}
.g-testa{display:flex;justify-content:space-between;align-items:baseline;padding:6px 2px 8px;border-bottom:1px solid var(--linea)}
.g-titolo{font-size:15px;font-weight:700;margin:0}
.sed{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--linea);text-align:left}
.sed-d{font-size:14.5px;font-weight:500}
.sed-m{font-family:var(--mono);font-size:10.5px;color:var(--tenue);margin-top:3px}
.sed-k{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dett{padding:8px 2px 12px}
.dett-v{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--tenue);padding:4px 0}
.vuoto{background:var(--superficie);border:1px dashed var(--linea);border-radius:3px;padding:20px;font-size:14px;color:var(--tenue);line-height:1.55}
.campo{width:100%;padding:12px;font-size:15px;border:1px solid var(--linea);border-radius:3px;background:var(--superficie);color:var(--inchiostro);margin-top:8px}
.campo.export{font-family:var(--mono);font-size:10.5px}
.interr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea)}
.interr:last-child{border-bottom:none}
.interr-t{font-size:14px;font-weight:500}
.interr-s{font-size:12px;color:var(--tenue);margin-top:2px}
.sw{width:52px;height:30px;border-radius:16px;background:var(--linea);position:relative;flex-shrink:0;transition:background .2s}
.sw.on{background:var(--verde)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on i{left:25px}

.barra{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--superficie);border-top:1px solid var(--linea);max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);z-index:30}
.b-voce{flex:1;padding:15px 4px;font-size:12px;color:var(--tenue);border-top:2px solid transparent;margin-top:-1px;font-weight:500}
.b-voce.on{color:var(--inchiostro);border-top-color:var(--inchiostro);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="timer" id="timer">
  <div class="t-riga">
    <div><div class="t-et" id="t-et">Recupero</div><div class="t-num" id="t-num">1:00</div></div>
    <div class="t-bot">
      <button class="t-b" data-az="t-piu">+15s</button>
      <button class="t-b" data-az="t-stop">Chiudi</button>
    </div>
  </div>
  <div class="t-linea"><i id="t-linea"></i></div>
</div>

<script>
/* ============================================================
   PALESTRA — scheda di Sofia Pilan, Virgin Active.
   Dati nella memoria del telefono. Niente rete, niente account.
   ============================================================ */

/* Ordine chiesto da Manlio il 2026-08-18: una sola attività aerobica in
   apertura (la camminata), poi tutti i pesi di fila senza interruzioni, poi
   15 minuti di cyclette in chiusura. La bici ellittica di metà seduta è
   uscita da entrambi i giorni. Le serie di pesi non sono state toccate. */
var SCHEDA = {
  1: { nome:"Giorno 1", es:[
    {n:"Tapis roulant", t:"cardio", min:15, nota:"Aumenta gradualmente la pendenza"},
    {n:"Abductor", t:"serie", set:4, rip:20, rec:60},
    {n:"Adductor", t:"serie", set:3, rip:12, rec:60},
    {n:"Leg press", t:"serie", set:4, rip:10, rec:60},
    {n:"Chest press", t:"serie", set:3, rip:12, rec:60},
    {n:"Low row", t:"serie", set:4, rip:15, rec:60},
    {n:"Cyclette", t:"cardio", min:15}
  ]},
  2: { nome:"Giorno 2", es:[
    {n:"Camminata in salita", t:"cardio", min:20, nota:"Aumenta gradualmente la pendenza"},
    {n:"Chest incline", t:"serie", set:3, rip:10, rec:60},
    {n:"Upper back", t:"serie", set:3, rip:10, rec:60},
    {n:"Vertical traction", t:"serie", set:4, rip:12, rec:60},
    {n:"Leg extension", t:"serie", set:3, rip:10, rec:60},
    {n:"Leg curl", t:"serie", set:3, rip:12, rec:60},
    {n:"Cyclette", t:"cardio", min:15}
  ]}
};

/* Le sedute salvate puntano agli esercizi per posizione, non per nome: dopo il
   riordino punterebbero all'esercizio sbagliato. Questa tabella rinumera una
   volta sola le sedute vecchie. Le posizioni che mancano sono gli esercizi
   usciti dalla scheda: quelle spunte si perdono, non hanno più un posto dove
   stare. Serie, volume e totali già archiviati non cambiano. */
var SCHEDA_V=2;
var RINUMERA={
  1:{0:0, 1:1, 2:2, 3:3, 5:4, 6:5, 7:6},   /* 4 era la bici ellittica */
  2:{1:1, 2:2, 3:3, 5:4, 6:5, 7:0}         /* 0 era la cyclette iniziale, 4 la bici ellittica,
                                              7 la camminata finale che ora apre la seduta */
};

var K_CFG="palestra.config", K_IDX="palestra.indice", K_S="palestra.s.";
var GG=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
var MM=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

function p2(n){return String(n).padStart(2,"0");}
function oggiISO(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function dataEstesa(iso){var a=iso.split("-").map(Number);var d=new Date(a[0],a[1]-1,a[2]);return GG[d.getDay()]+" "+d.getDate()+" "+MM[d.getMonth()];}
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+p2(s%60);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function num(v,d){return (Number(v)||0).toFixed(d||0).replace(".",",");}

var memOk=true;
function leggi(k,def){try{var v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){memOk=false;return def;}}
function scrivi(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){memOk=false;return false;}}

var S={
  vista:"allenamento", data:oggiISO(), giorno:1,
  fatte:{},           // "indice-serie" -> true
  pesi:{},            // nome esercizio -> kg di oggi
  pesiPrec:{},        // ultimi kg registrati
  cardio:{},          // indice -> true se completato
  indice:{}, riposo:60, schermo:true, ultimo:null, schedaV:SCHEDA_V,
  msg:null, spia:"", focus:null, aperto:null, apertoS:null, export:"", importa:""
};

/* ---------- avvio ---------- */
function avvia(){
  var cfg=leggi(K_CFG,null);
  if(cfg){
    S.pesiPrec=cfg.pesiPrec||{}; S.riposo=cfg.riposo||60;
    S.schermo=cfg.schermo!==false; S.ultimo=cfg.ultimo||null;
    S.schedaV=cfg.schedaV||1;   /* senza il numero è una configurazione di prima del riordino */
  }
  migraSedute();
  S.indice=leggi(K_IDX,{})||{};
  var s=leggi(K_S+S.data,null);
  if(s){ S.giorno=s.giorno||1; S.fatte=s.fatte||{}; S.pesi=s.pesi||{}; S.cardio=s.cardio||{}; }
  else { S.giorno=(S.ultimo===1)?2:1; }
  if(!memOk) S.msg="Questo browser non permette il salvataggio. Esci dalla navigazione privata.";
  render();
}
function salvaCfg(){ scrivi(K_CFG,{pesiPrec:S.pesiPrec,riposo:S.riposo,schermo:S.schermo,ultimo:S.ultimo,schedaV:S.schedaV}); }

/* Rinumera le sedute salvate dopo il riordino della scheda. Gira una volta
   sola: il numero di versione resta scritto in configurazione. Se ripartisse
   una seconda volta sposterebbe di nuovo le spunte, quindi il numero va
   salvato insieme a tutto il resto (vedi salvaCfg e ripristina). */
function migraSedute(){
  if(S.schedaV>=SCHEDA_V) return;
  var chiavi=[];
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf(K_S)===0) chiavi.push(k);
    }
  }catch(e){ return; }
  chiavi.forEach(function(k){
    var s=leggi(k,null); if(!s) return;
    var m=RINUMERA[s.giorno||1]; if(!m) return;
    var nf={}, nc={}, key, p, vecchio;
    for(key in s.fatte){
      if(!s.fatte[key]) continue;
      p=key.split("-"); vecchio=Number(p[0]);
      if(m[vecchio]===undefined) continue;      /* esercizio uscito dalla scheda */
      nf[m[vecchio]+"-"+p[1]]=true;
    }
    for(key in s.cardio){
      if(!s.cardio[key]) continue;
      vecchio=Number(key);
      if(m[vecchio]===undefined) continue;
      nc[m[vecchio]]=true;
    }
    s.fatte=nf; s.cardio=nc;
    scrivi(k,s);
  });
  S.schedaV=SCHEDA_V;
  salvaCfg();
}

function totSerie(){var t=0;SCHEDA[S.giorno].es.forEach(function(e){if(e.t==="serie")t+=e.set;});return t;}
function fatteN(){var n=0;for(var k in S.fatte)if(S.fatte[k])n++;return n;}

var tSalva=null;
function salva(){
  S.spia="in corso"; spiaAgg();
  clearTimeout(tSalva);
  tSalva=setTimeout(function(){
    var vol=0;
    SCHEDA[S.giorno].es.forEach(function(e,i){
      if(e.t!=="serie")return;
      var kg=Number(S.pesi[e.n])||0;
      for(var j=0;j<e.set;j++) if(S.fatte[i+"-"+j]) vol+=kg*e.rip;
    });
    var ok=scrivi(K_S+S.data,{giorno:S.giorno,fatte:S.fatte,pesi:S.pesi,cardio:S.cardio,volume:vol});
    var n=fatteN();
    if(n===0 && Object.keys(S.cardio).length===0) delete S.indice[S.data];
    else S.indice[S.data]={giorno:S.giorno,serie:n,tot:totSerie(),volume:Math.round(vol)};
    ok=scrivi(K_IDX,S.indice)&&ok;
    S.ultimo=S.giorno; salvaCfg();
    S.spia=ok?"salvato":"non salvato"; spiaAgg();
    setTimeout(function(){S.spia="";spiaAgg();},1500);
  },400);
}
function spiaAgg(){var e=document.querySelector(".spia");if(e)e.textContent=S.spia;}

/* ---------- timer ---------- */
var T={fine:0,durata:0,att:false,et:"Recupero",id:null};
function avviaTimer(sec,etichetta){
  T.fine=Date.now()+sec*1000; T.durata=sec; T.att=true; T.et=etichetta||"Recupero";
  document.getElementById("t-et").textContent=T.et;
  var box=document.getElementById("timer");
  box.classList.add("su"); box.classList.remove("finito");
  sbloccaAudio();
  clearInterval(T.id); T.id=setInterval(tic,200); tic();
}
function tic(){
  /* se per qualsiasi motivo la pagina non ha ancora i pezzi del timer, meglio
     fermarsi che sollevare un errore ogni 200 ms e piantare tutto il resto */
  var num=document.getElementById("t-num"), lin=document.getElementById("t-linea"),
      box=document.getElementById("timer"), et=document.getElementById("t-et");
  if(!num||!lin||!box||!et){ clearInterval(T.id); return; }
  var r=(T.fine-Date.now())/1000;
  num.textContent=mmss(Math.max(0,r));
  lin.style.width=Math.max(0,Math.min(100,T.durata?(r/T.durata)*100:0))+"%";
  if(r<=0){
    clearInterval(T.id); T.att=false;
    box.classList.add("finito");
    et.textContent="Vai con la prossima";
    segnale();
    setTimeout(function(){
      var b=document.getElementById("timer");
      if(!T.att&&b) b.classList.remove("su");
    },8000);
  }
}
function fermaTimer(){
  clearInterval(T.id); T.att=false;
  var b=document.getElementById("timer"); b.classList.remove("su"); b.classList.remove("finito");
}
var AC=null;
function sbloccaAudio(){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended")AC.resume(); }catch(e){}
}
function segnale(){
  try{ if(navigator.vibrate) navigator.vibrate([220,110,220,110,420]); }catch(e){}
  try{
    if(!AC)return;
    [0,0.22,0.44].forEach(function(d){
      var o=AC.createOscillator(), g=AC.createGain();
      o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,AC.currentTime+d);
      g.gain.exponentialRampToValueAtTime(0.35,AC.currentTime+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d+0.18);
      o.connect(g); g.connect(AC.destination);
      o.start(AC.currentTime+d); o.stop(AC.currentTime+d+0.2);
    });
  }catch(e){}
}
/* schermo sempre acceso */
var WL=null;
function schermoAcceso(v){
  try{
    if(v && "wakeLock" in navigator){
      if(WL) return;                       /* già acceso, non accumularne un altro */
      navigator.wakeLock.request("screen").then(function(l){
        WL=l;
        /* il telefono lo rilascia da solo quando la pagina va in secondo piano:
           se non ce ne accorgessimo, al ritorno non lo richiederemmo più */
        try{ l.addEventListener("release",function(){ WL=null; }); }catch(e){}
      }).catch(function(){ WL=null; });
    } else if(WL){ try{ WL.release(); }catch(e){} WL=null; }
  }catch(e){}
}
/* Al ritorno da schermo spento la pagina va ridisegnata sempre, non solo
   quando è cambiato il giorno. Il telefono può sospendere o buttare via la
   pagina mentre è in tasca: al risveglio restava com'era rimasta, a volte
   vuota. Ridisegnarla la rimette in piedi in ogni caso. */
function alRisveglio(){
  if(document.hidden) return;
  if(S.schermo) schermoAcceso(true);
  var d=oggiISO();
  if(d!==S.data){ S.data=d; S.fatte={}; S.pesi={}; S.cardio={}; S.giorno=(S.ultimo===1)?2:1; }
  render();
  if(T.att) tic();
}
document.addEventListener("visibilitychange",alRisveglio);
window.addEventListener("pageshow",alRisveglio);

/* ---------- render ---------- */
function render(){
  var h="";
  h+='<header class="testata"><div class="riga"><div>'+
     '<div class="occhiello">Palestra</div>'+
     '<h1 class="titolone">'+(S.vista==="allenamento"?SCHEDA[S.giorno].nome:S.vista==="storico"?"Storico":"Impostazioni")+'</h1>'+
     '<div class="sotto">'+dataEstesa(S.data)+'</div></div><div class="spia">'+S.spia+'</div></div></header>';
  if(S.msg) h+='<div class="avviso" data-az="chiudi-msg">'+esc(S.msg)+' <span class="avviso-x">chiudi</span></div>';
  h+='<main class="corpo">';
  if(S.vista==="allenamento") h+=vAllenamento();
  else if(S.vista==="storico") h+=vStorico();
  else h+=vImpostazioni();
  h+='</main>';
  h+='<nav class="barra">';
  [["allenamento","Allenamento"],["storico","Storico"],["impostazioni","Impostazioni"]].forEach(function(v){
    h+='<button class="b-voce'+(S.vista===v[0]?" on":"")+'" data-az="vista" data-v="'+v[0]+'">'+v[1]+'</button>';
  });
  h+='</nav>';
  document.getElementById("app").innerHTML=h;
  if(S.focus){
    var e=document.querySelector('[data-in="'+S.focus+'"]');
    if(e){e.focus();try{var n=e.value.length;e.setSelectionRange(n,n);}catch(x){}}
  }
}

function vAllenamento(){
  var g=SCHEDA[S.giorno], h="", tot=totSerie(), fatte=fatteN();
  var consigliato=(S.ultimo===1)?2:1;

  h+='<div class="giorni">';
  [1,2].forEach(function(k){
    var nEs=SCHEDA[k].es.length;
    h+='<button class="gio'+(S.giorno===k?" on":"")+'" data-az="giorno" data-v="'+k+'">'+
       '<b>'+SCHEDA[k].nome+'</b><span>'+nEs+' esercizi</span>'+
       (k===consigliato&&S.giorno!==k?'<span class="consiglio">tocca a questo</span>':'')+'</button>';
  });
  h+='</div>';

  h+='<section class="pannello"><div class="avanz"><span class="etichetta">Serie completate</span>'+
     '<span class="avanz-c">'+fatte+'<span>/'+tot+'</span></span></div>'+
     '<div class="nastro"><i style="width:'+(tot?fatte/tot*100:0)+'%"></i></div></section>';

  g.es.forEach(function(e,i){
    if(e.t==="cardio"){
      var done=!!S.cardio[i];
      h+='<div class="es'+(done?" fatto":"")+'"><div class="es-testa"><h2 class="es-nome">'+esc(e.n)+'</h2>'+
         '<span class="es-pre">'+e.min+"'"+'</span></div>';
      if(e.nota) h+='<div class="es-nota">'+esc(e.nota)+'</div>';
      h+='<button class="bcardio'+(done?" on":"")+'" data-az="cardio" data-i="'+i+'">'+
         (done?"Fatto — tocca per annullare":"Avvia "+e.min+" minuti")+'</button></div>';
      return;
    }
    var f=0; for(var j=0;j<e.set;j++) if(S.fatte[i+"-"+j]) f++;
    var prec=S.pesiPrec[e.n];
    h+='<div class="es'+(f===e.set?" fatto":"")+'"><div class="es-testa">'+
       '<h2 class="es-nome">'+esc(e.n)+'</h2>'+
       '<span class="es-pre">'+e.set+' × '+e.rip+' · rec '+mmss(e.rec)+'</span></div>';
    if(e.nota) h+='<div class="es-nota">'+esc(e.nota)+'</div>';
    h+='<div class="serie">';
    for(var j2=0;j2<e.set;j2++){
      var on=!!S.fatte[i+"-"+j2];
      h+='<button class="set'+(on?" on":"")+'" data-az="set" data-i="'+i+'" data-j="'+j2+'">'+
         '<b>'+e.rip+'</b><i>'+(j2+1)+'ª</i></button>';
    }
    h+='</div><div class="peso"><input data-in="kg-'+i+'" type="number" inputmode="decimal" '+
       'placeholder="kg" value="'+(S.pesi[e.n]!==undefined?S.pesi[e.n]:"")+'"><span class="u">kg</span>'+
       (prec!==undefined&&prec!==""?'<span class="prec">ultima volta<br>'+num(prec,1)+' kg</span>':'')+
       '</div></div>';
  });

  if(fatte>0||Object.keys(S.cardio).length>0)
    h+='<button class="b2" data-az="azzera">Azzera la seduta di oggi</button>';
  return h;
}

function vStorico(){
  var g=Object.keys(S.indice).sort().reverse();
  if(!g.length) return '<div class="vuoto">Nessuna seduta ancora. Appena spunti la prima serie, questa pagina comincia a riempirsi.</div>';
  var h="", n30=g.slice(0,30);
  h+='<section class="pannello"><div class="etichetta">Ultime sedute</div>'+
     '<div class="avanz" style="margin-top:8px"><span class="sotto">'+g.length+' sedute registrate</span>'+
     '<span class="avanz-c">'+n30.filter(function(d){return S.indice[d].giorno===1;}).length+
     '<span> G1 · '+n30.filter(function(d){return S.indice[d].giorno===2;}).length+' G2</span></span></div></section>';
  g.forEach(function(d){
    var v=S.indice[d];
    h+='<div class="gruppo"><button class="sed" data-az="apri" data-d="'+d+'"><div>'+
       '<div class="sed-d">'+dataEstesa(d)+'</div>'+
       '<div class="sed-m">'+SCHEDA[v.giorno].nome+' · '+v.serie+' di '+v.tot+' serie</div></div>'+
       '<div class="sed-k">'+(v.volume?num(v.volume)+" kg":"—")+'</div></button>';
    if(S.aperto===d&&S.apertoS){
      h+='<div class="dett">';
      SCHEDA[S.apertoS.giorno].es.forEach(function(e,i){
        if(e.t==="cardio"){ if(S.apertoS.cardio&&S.apertoS.cardio[i]) h+='<div class="dett-v"><span>'+esc(e.n)+'</span><span>'+e.min+"'"+'</span></div>'; return; }
        var f=0; for(var j=0;j<e.set;j++) if(S.apertoS.fatte&&S.apertoS.fatte[i+"-"+j]) f++;
        if(f) h+='<div class="dett-v"><span>'+esc(e.n)+'</span><span>'+f+'×'+e.rip+
                 (S.apertoS.pesi&&S.apertoS.pesi[e.n]?' · '+num(S.apertoS.pesi[e.n],1)+' kg':'')+'</span></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  return h;
}

function vImpostazioni(){
  var h='<section class="pannello"><div class="etichetta">Durante l\'allenamento</div>';
  h+='<div class="interr" data-az="sw-schermo"><div><div class="interr-t">Schermo sempre acceso</div>'+
     '<div class="interr-s">Serve perché il timer suoni. Consuma più batteria.</div></div>'+
     '<div class="sw'+(S.schermo?" on":"")+'"><i></i></div></div>';
  h+='<div class="interr"><div><div class="interr-t">Recupero fra le serie</div>'+
     '<div class="interr-s">Sulla scheda è 1 minuto.</div></div>'+
     '<input class="campo" style="width:88px;margin:0" data-in="riposo" type="number" inputmode="numeric" value="'+S.riposo+'"></div>';
  h+='<div class="nota">Il conto alla rovescia usa l\'orologio del telefono: se esci dall\'app e torni, il tempo mostrato è quello vero.</div></section>';

  h+='<section class="pannello"><div class="etichetta">Prova il segnale</div>'+
     '<div class="nota">Toccalo una volta prima di cominciare, così il telefono autorizza il suono.</div>'+
     '<button class="b2" data-az="prova">Fai suonare adesso</button></section>';

  h+='<section class="pannello"><div class="etichetta">Copia di sicurezza</div>'+
     '<div class="nota">I dati stanno solo su questo telefono. Se cancelli i dati del browser, spariscono.</div>'+
     '<button class="b1" data-az="scarica">Scarica il file di backup</button>'+
     '<button class="b2" data-az="esporta">Mostra il testo da copiare</button>';
  if(S.export) h+='<textarea class="campo export" rows="6" readonly>'+esc(S.export)+'</textarea>';
  h+='<textarea class="campo export" data-in="importa" rows="3" placeholder="Incolla qui un backup"></textarea>'+
     '<button class="b2" data-az="importa">Ripristina</button></section>';

  h+='<section class="pannello"><div class="etichetta">La scheda</div>'+
     '<div class="nota">Due giorni, redatta da Sofia Pilan per Virgin Active. Gli esercizi sono scritti dentro l\'app: per cambiarli serve una nuova versione del file.</div></section>';
  return h;
}

/* ---------- eventi ---------- */
document.body.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-az]"); if(!b) return;
  var az=b.getAttribute("data-az"), v=b.getAttribute("data-v");

  if(az==="vista"){ S.vista=v; S.focus=null; render(); }
  else if(az==="chiudi-msg"){ S.msg=null; render(); }
  else if(az==="giorno"){
    if(fatteN()>0||Object.keys(S.cardio).length>0){
      S.msg="Hai già spuntato qualcosa. Azzera la seduta prima di cambiare giorno.";
    } else { S.giorno=Number(v); }
    render();
  }
  else if(az==="set"){
    var i=b.getAttribute("data-i"), j=b.getAttribute("data-j"), k=i+"-"+j;
    var e=SCHEDA[S.giorno].es[Number(i)];
    if(S.fatte[k]){ delete S.fatte[k]; fermaTimer(); }
    else { S.fatte[k]=true; avviaTimer(S.riposo||e.rec||60,"Recupero — "+e.n); }
    salva(); render();
  }
  else if(az==="cardio"){
    var ci=b.getAttribute("data-i"), ce=SCHEDA[S.giorno].es[Number(ci)];
    if(S.cardio[ci]){ delete S.cardio[ci]; fermaTimer(); }
    else { S.cardio[ci]=true; avviaTimer(ce.min*60,ce.n+" — "+ce.min+" minuti"); }
    salva(); render();
  }
  else if(az==="t-piu"){ if(T.att){T.fine+=15000;T.durata+=15;tic();} else {avviaTimer(15,"Ancora un attimo");} }
  else if(az==="t-stop"){ fermaTimer(); }
  else if(az==="azzera"){
    SCHEDA[S.giorno].es.forEach(function(e){ if(S.pesi[e.n]) S.pesiPrec[e.n]=S.pesi[e.n]; });
    S.fatte={}; S.cardio={}; salvaCfg(); salva(); fermaTimer(); render();
  }
  else if(az==="apri"){
    var d=b.getAttribute("data-d");
    if(S.aperto===d){S.aperto=null;S.apertoS=null;} else {S.aperto=d;S.apertoS=leggi(K_S+d,null);}
    render();
  }
  else if(az==="sw-schermo"){ S.schermo=!S.schermo; schermoAcceso(S.schermo); salvaCfg(); render(); }
  else if(az==="prova"){ sbloccaAudio(); setTimeout(segnale,120); }
  else if(az==="esporta"){ S.export=JSON.stringify(raccogli()); render(); }
  else if(az==="scarica"){ scarica(); }
  else if(az==="importa"){ ripristina(); }
});

document.body.addEventListener("input",function(ev){
  var e=ev.target, k=e.getAttribute("data-in"); if(!k) return;
  S.focus=k;
  if(k.indexOf("kg-")===0){
    var i=Number(k.slice(3)), es=SCHEDA[S.giorno].es[i];
    S.pesi[es.n]=e.value; S.pesiPrec[es.n]=e.value; salvaCfg(); salva();
  }
  else if(k==="riposo"){ S.riposo=Math.max(5,Number(e.value)||60); salvaCfg(); }
  else if(k==="importa"){ S.importa=e.value; }
});

/* ---------- backup ---------- */
function raccogli(){
  var o={versione:1,schedaV:S.schedaV,pesiPrec:S.pesiPrec,riposo:S.riposo,indice:S.indice,sedute:{}};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf(K_S)===0) o.sedute[k.slice(K_S.length)]=leggi(k,null);
  }
  return o;
}
function scarica(){
  try{
    var b=new Blob([JSON.stringify(raccogli(),null,1)],{type:"application/json"});
    var u=URL.createObjectURL(b), a=document.createElement("a");
    a.href=u; a.download="palestra-"+oggiISO()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},2000);
    S.msg="File scaricato."; render();
  }catch(e){ S.msg="Scaricamento non riuscito. Usa il testo da copiare."; render(); }
}
function ripristina(){
  try{
    var d=JSON.parse(S.importa);
    if(!d.sedute) throw new Error("formato");
    Object.keys(d.sedute).forEach(function(k){ scrivi(K_S+k,d.sedute[k]); });
    if(d.indice) scrivi(K_IDX,d.indice);
    /* un backup senza schedaV è di prima del riordino: al prossimo avvio le sue
       sedute vanno rinumerate, quindi si riparte da 1 */
    scrivi(K_CFG,{pesiPrec:d.pesiPrec||S.pesiPrec,riposo:d.riposo||S.riposo,schermo:S.schermo,ultimo:S.ultimo,schedaV:d.schedaV||1});
    S.msg="Ripristinato. Ricarico…"; render();
    setTimeout(function(){location.reload();},900);
  }catch(e){ S.msg="Quel testo non è un backup valido."; render(); }
}

avvia();
if(S.schermo) schermoAcceso(true);
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
